name: Mobile checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  pengingat-tagihan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.3'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter @workspace/pengingat-tagihan run typecheck

      - name: Run mobile regression tests
        run: pnpm --filter @workspace/pengingat-tagihan run test
