name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-preview-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.3'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android
        run: pnpm --filter @workspace/pengingat-tagihan exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: artifacts/pengingat-tagihan/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign preview APK
        shell: bash
        run: |
          set -euo pipefail
          INPUT_APK="$(find artifacts/pengingat-tagihan/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$INPUT_APK"
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/ingat-tagihan-preview.keystore"             -storepass android             -alias ingat-tagihan-preview             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Ingat Tagihan Preview,O=TWIS Network,C=ID"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/ingat-tagihan-preview.keystore"             --ks-key-alias ingat-tagihan-preview             --ks-pass pass:android             --key-pass pass:android             --out artifacts/pengingat-tagihan/Ingat-Tagihan-preview.apk             "$INPUT_APK"
          "$APKSIGNER" verify --verbose artifacts/pengingat-tagihan/Ingat-Tagihan-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ingat-Tagihan-preview
          path: artifacts/pengingat-tagihan/Ingat-Tagihan-preview.apk
          if-no-files-found: error
          retention-days: 14
